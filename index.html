<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4A"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Carnet">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet de Solène</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout : carnet à onglets — barre latérale fixe (desktop) / rail d'onglets défilant (mobile), chaque rubrique a sa teinte. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#E3E9E5; --ink:#17221C; --muted:#56655C; --line:#D2DBD5;
  --accL:.50; --accC:.12; --tintL:.955; --tintC:.028; --chipL:.90;
  --ok:#2C7A4B; --warn:#B0631A; --danger:#B4342A;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 20px rgba(20,40,30,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-quote:"Newsreader",Georgia,"Times New Roman",serif;
  --r:14px; --r-s:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#17201B; --surface-2:#212C26; --ink:#E4ECE7; --muted:#9AABA1; --line:#2B3831;
  --accL:.78; --accC:.11; --tintL:.25; --tintC:.035; --chipL:.33;
  --ok:#6FCB92; --warn:#E3A564; --danger:#F08A80; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#17201B; --surface-2:#212C26; --ink:#E4ECE7; --muted:#9AABA1; --line:#2B3831;
  --accL:.78; --accC:.11; --tintL:.25; --tintC:.035; --chipL:.33;
  --ok:#6FCB92; --warn:#E3A564; --danger:#F08A80; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.acc{color:oklch(var(--accL) var(--accC) var(--h,165))}
[style*="--h"], .h{--a:oklch(var(--accL) var(--accC) var(--h));--t:oklch(var(--tintL) var(--tintC) var(--h));--c:oklch(var(--chipL) calc(var(--accC)*.55) var(--h))}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid oklch(var(--accL) var(--accC) var(--h,165));outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px 16px max(14px,env(safe-area-inset-left,0px));gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,oklch(.62 .13 165),oklch(.62 .13 250),oklch(.66 .13 305),oklch(.72 .13 45),oklch(.62 .13 165));flex:none;position:relative}
.brand-mark::after{content:"";position:absolute;inset:7px;border-radius:5px;background:var(--surface)}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px}
.ic{flex:none;vertical-align:-3px}
.nav a .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--a);background:var(--t);flex:none;transition:transform .2s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--t);color:var(--ink)}
.nav a[aria-current="page"] .ico{background:var(--a);color:var(--surface);transform:rotate(-6deg)}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--c);color:var(--ink);border-radius:20px;padding:0 7px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.sync{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="err"]::before{background:var(--danger)}

main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (min-width:900px){main{padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}}

.vh{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;padding:26px 26px 24px;border-radius:20px;background:var(--t);position:relative;overflow:hidden}
.vh::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid var(--a);opacity:.09;pointer-events:none}
.vh > div{min-width:0;max-width:66ch;position:relative;z-index:1}
.vh-main{display:flex;gap:16px;align-items:flex-start}
.vh-ico{width:54px;height:54px;border-radius:16px;background:var(--a);color:var(--surface);display:grid;place-items:center;flex:none;transform:rotate(-5deg);box-shadow:0 6px 18px -6px var(--a)}
@media (max-width:520px){.vh-ico{width:42px;height:42px;border-radius:12px}.vh-ico svg{width:22px;height:22px}}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--a)}
.vh h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.lede{color:var(--muted);margin-top:6px;font-size:15.5px}
.vh-side{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.grid-2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 > .ic{color:var(--a);width:20px;height:20px}
.card h3 .ic{color:var(--a)}
.card h2 .sub{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);margin-left:auto}
.card h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-s)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--a,oklch(var(--accL) var(--accC) 165));border-color:transparent;color:var(--surface)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.btn.on{background:var(--c);border-color:transparent}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px 6px;font-size:16px;line-height:1}
.x:hover{color:var(--danger);background:var(--surface-2)}

input[type=text],input[type=url],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a,oklch(var(--accL) var(--accC) 165));outline-offset:-1px;border-color:transparent}
form.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.add > input[type=text]{flex:1 1 200px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:var(--c);border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip.out{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:transparent;color:var(--warn);border:1px solid currentColor}
.chip.late{background:transparent;color:var(--danger);border:1px solid currentColor}
.chip.ex{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--a);flex:none}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t{font-weight:600}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center;font-size:12.5px;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;width:19px;height:19px;border:2px solid var(--a,var(--muted));border-radius:6px;flex:none;margin-top:2px;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.check:checked{background:var(--a,var(--ok))}
.check:checked::after{content:"";width:9px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.prio{width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.prio.p3{background:var(--danger)} .prio.p2{background:var(--warn)}

.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--a);border-radius:8px;transition:width .3s}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats > div{display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--c);border-color:transparent}
.note{font-size:13.5px;background:var(--surface-2);border-radius:var(--r-s);padding:11px 13px;color:var(--ink)}
.note b{font-weight:700}
details summary{cursor:pointer;font-weight:600}

.detail{margin-top:6px;font-size:14px;background:var(--surface)}
.detail-prev{font-size:13px;color:var(--muted);margin-top:4px;padding-left:8px;border-left:2px solid var(--line);white-space:pre-line}
.dbtn{font-size:13px}
.dbtn.has{color:var(--a)}
.tagsel{font-size:12.5px;padding:3px 6px;border-radius:7px;background:transparent;max-width:150px}
.chip .ic{vertical-align:-2px}
.fic{width:38px;height:44px;border-radius:7px;background:var(--t);color:var(--a);font-size:10.5px;font-weight:800;display:grid;place-items:center;flex:none;border:1px solid var(--line);letter-spacing:.04em}
a.t{color:var(--ink);text-decoration:none}
a.t:hover{text-decoration:underline}
.due-t{display:flex;gap:5px;align-items:flex-start;font-size:12.5px;text-decoration:none;color:var(--muted);padding:3px 4px;border-radius:6px;overflow-wrap:anywhere}
.due-t .ic{color:var(--a);margin-top:2px}
.due-t:hover{background:var(--surface-2);color:var(--ink)}
.todo-t{color:var(--ink);background:var(--t);border-left:3px solid var(--a);align-items:center}
.todo-t a{color:inherit;text-decoration:none;flex:1}
.todo-t.late{border-left-color:var(--danger)}
.todo-t .lt{color:var(--danger);font-weight:700;font-size:11px}
.tick{flex:none;width:15px;height:15px;border-radius:5px;border:1.6px solid var(--a);background:var(--surface);cursor:pointer;padding:0}
.tick:hover{background:var(--a)}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.month{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;background:var(--bg);min-width:0}
.month h3{font-size:15px;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums}
.mgrid b{color:var(--muted);font-size:10px;font-weight:700}
.mc{padding:3px 0;border-radius:5px;color:var(--muted)}
.mc.camp{background:var(--c);color:var(--ink);font-weight:600}
.mc.has{background:var(--a);color:var(--surface);font-weight:800}
.mc.now{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)}
.mlist{display:flex;flex-direction:column;gap:3px}
.mrow{display:flex;gap:7px;font-size:12.5px;align-items:baseline;border-left:3px solid var(--a);padding-left:6px;overflow-wrap:anywhere;min-width:0}
.mrow.done{color:var(--muted);text-decoration:line-through}
.mday{font-weight:800;font-variant-numeric:tabular-nums;color:var(--a);min-width:16px}
.legend{gap:14px}
.lg{width:11px;height:11px;border-radius:3px;background:var(--a);display:inline-block}
.lg.camp{background:oklch(var(--chipL) calc(var(--accC)*.55) 135)}
details.card > summary{display:flex;gap:6px;align-items:center}
.prayer{font-family:var(--f-quote);font-style:italic;font-size:18px;line-height:1.55}
ol.loi{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:5px}
ol.loi li::marker{font-family:var(--f-display);font-weight:800;color:var(--a)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--ink)}
.tabs button .ic{color:var(--a)}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:800px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:160px;border:2px dashed transparent;min-width:0}
.kcol.over{border-color:var(--a)}
.kcol h2{font-size:16px;display:flex;gap:8px;align-items:baseline}
.kcol h2 .sub{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:var(--shadow);overflow-wrap:anywhere}
.kcard.drag{opacity:.5}
.kcard .t{font-weight:600}
.kcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.kact{display:flex;align-items:center;gap:4px}
.item.editing{display:block}
.tedit{display:flex;flex-direction:column;gap:10px;width:100%;padding:4px 0}
.tedit-row{display:flex;gap:8px;flex-wrap:wrap}.tedit-row .f{flex:1 1 120px;min-width:0}
.tedit input,.tedit select,.tedit textarea{width:100%;box-sizing:border-box}
.kcard.editing{cursor:default}
.item .t[data-act],.kcard .t[data-act]{cursor:pointer}
.kempty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
.carnet{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.carnet{grid-template-columns:1fr}}
.cpages .list{gap:4px}
.cp{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer;width:100%}
.cp:hover{background:var(--surface-2)}
.cp.on{background:var(--t)}
.cp small{color:var(--muted);font-size:12px}
.paper{--line-h:30px;background:var(--surface);border:1px solid var(--line);border-radius:6px 16px 16px 6px;padding:22px 26px 30px 54px;box-shadow:var(--shadow);position:relative;min-width:0;
  background-image:linear-gradient(90deg,transparent 38px,color-mix(in oklab,var(--danger) 45%,transparent) 38px,color-mix(in oklab,var(--danger) 45%,transparent) 39.5px,transparent 39.5px)}
.ptitle{border:0;background:transparent;font-family:var(--f-display);font-size:24px;font-weight:700;flex:1;min-width:0;padding:0}
.ptitle:focus,.ptext:focus{outline:none}
.pdate{color:var(--muted);font-size:13px;margin:2px 0 8px}
.pdate::first-letter{text-transform:uppercase}
.ptext{border:0;width:100%;min-height:420px;resize:none;overflow:hidden;font-family:var(--f-quote);font-size:19px;line-height:var(--line-h);padding:0;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--line-h) - 1px),var(--line) calc(var(--line-h) - 1px),var(--line) var(--line-h));background-attachment:local}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:9px 8px;background:var(--surface-2);white-space:nowrap}
.tbl td{padding:4px 5px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.c{text-align:center;vertical-align:middle;white-space:nowrap}
.tbl .check{margin:0 auto}
.tbl textarea.cellt,.tbl input:not([type=checkbox]),.tbl select{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 6px;width:100%;resize:none;overflow:hidden;line-height:1.4}
.tbl textarea.cellt:hover,.tbl input:not([type=checkbox]):hover,.tbl select:hover{border-color:var(--line)}
.tbl tr:hover td{background:color-mix(in oklab,var(--t) 50%,transparent)}
.st{font-weight:600}
.chip.st-0,.st.st-0{--h:250}
.chip.st-1,.st.st-1{--h:60}
.chip.st-2,.st.st-2{--h:200}
.chip.st-3,.st.st-3{--h:20}
.chip.st-4,.st.st-4{--h:145}
.st-0,.st-1,.st-2,.st-3,.st-4{--c:oklch(var(--chipL) calc(var(--accC)*.55) var(--h))}
.st{background:var(--c)!important}
.filebar{max-width:1120px;margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;border-radius:12px;font-size:13.5px;border:1px solid var(--line);background:var(--surface)}
.filebar.warn{border-color:var(--warn);background:color-mix(in oklab,var(--warn) 12%,var(--surface))}
.filebar span{flex:1 1 260px;min-width:0}
#login{position:fixed;inset:0;z-index:60;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.login-card{width:min(100%,420px)}
.login-card input{width:100%}
/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}
.day-h{display:flex;align-items:baseline;gap:6px}
.day-h b{font-family:var(--f-display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.day-h span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ev{background:var(--t);border-left:3px solid var(--a);border-radius:7px;padding:5px 7px;font-size:13px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ev .tm{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.ev .acts{display:flex;gap:4px;margin-top:2px}
.ev .acts a,.ev .acts button{font-size:11.5px;border:0;background:transparent;color:var(--a);cursor:pointer;padding:0;text-decoration:underline;font-weight:600}
@media (max-width:900px){.week{grid-template-columns:1fr}.day{min-height:0}}

/* Idées */
.notes{columns:3 260px;column-gap:14px}
.pad{break-inside:avoid;margin-bottom:14px;background:var(--t);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pad input.title{background:transparent;border:0;font-family:var(--f-display);font-weight:700;font-size:17px;padding:2px 0;width:100%}
.pad textarea{background:transparent;border:0;padding:2px 0;min-height:90px;resize:none;overflow:hidden}
.pad input.title:focus,.pad textarea:focus{outline:none}
.pad .foot{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--surface);background:var(--a);cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.pin{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px}
.pin.on{color:var(--a)}

/* Foi */
.verse{font-family:var(--f-quote);font-style:italic;font-size:clamp(22px,3vw,30px);line-height:1.3;text-wrap:balance}
.ref{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--a)}
.linkbtn{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:11px;text-decoration:none;background:var(--surface)}
.linkbtn:hover{background:var(--t)}
.linkbtn b{display:block}
.linkbtn small{color:var(--muted)}
.linkbtn .arr{margin-left:auto;color:var(--a);font-weight:800}
.season{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;padding:4px 11px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.season i{width:10px;height:10px;border-radius:50%}

/* Cours / fiches */
.flash{border:1px solid var(--line);border-radius:16px;padding:26px 22px;background:var(--t);min-height:170px;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center}
.flash .q{font-family:var(--f-display);font-size:21px;font-weight:700}
.flash .a{font-size:16px}
.box{font-size:11px;font-weight:700;color:var(--muted)}

/* Jeux */
.sdk{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,430px);aspect-ratio:1;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;user-select:none;max-width:100%}
.sdk button{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:clamp(16px,4.6vw,24px);font-weight:600;cursor:pointer;padding:0;color:var(--a);font-variant-numeric:tabular-nums;min-width:0}
.sdk button.giv{color:var(--ink);font-weight:800}
.sdk button.c3{border-right:2.5px solid var(--ink)}
.sdk button.r3{border-bottom:2.5px solid var(--ink)}
.sdk button.peer{background:var(--surface-2)}
.sdk button.same{background:var(--c)}
.sdk button.sel{background:var(--a);color:var(--surface)}
.sdk button.bad{color:var(--danger);text-decoration:underline}
.pad9{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,430px)}
.pad9 button{padding:10px 0;font-size:18px;font-weight:700;font-family:var(--f-display)}
.cw{display:grid;gap:2px;width:max-content;max-width:100%}
.cw-wrap{overflow-x:auto;padding:2px}
.cw{--cs:34px}
@media (max-width:520px){.cw{--cs:28px}}
.cw div{width:var(--cs);height:var(--cs);position:relative}
.cw .blk{background:transparent}
.cw .cell{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px}
.cw .cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;text-transform:uppercase;font-weight:700;font-size:17px;padding:0;border-radius:3px}
.cw .cell input:focus{outline:none;background:var(--c)}
.cw .cell.hl{background:var(--t)}
.cw .cell.ok{background:color-mix(in oklab,var(--ok) 22%,var(--surface))}
.cw .cell.ko{background:color-mix(in oklab,var(--danger) 22%,var(--surface))}
.cw .num{position:absolute;top:0;left:2px;font-size:9px;font-weight:700;color:var(--muted);pointer-events:none}
.clues{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.clues ol{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px}
.clues li{cursor:pointer;border-radius:6px;padding:2px 6px}
.clues li:hover,.clues li.on{background:var(--t)}
.clues li b{font-variant-numeric:tabular-nums;margin-right:6px}
.peg{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);flex:none;padding:0}
.peg.filled{border-color:transparent}
.pegs{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.pegs i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.pegs i.b{background:var(--ink);border-color:var(--ink)}
.pegs i.w{background:var(--surface);border-color:var(--ink)}
.mm-row{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:10px}
.mm-row.cur{background:var(--t)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.opts button{text-align:left;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.opts button:hover:not(:disabled){background:var(--t)}
.opts button.good{background:color-mix(in oklab,var(--ok) 25%,var(--surface));border-color:var(--ok)}
.opts button.wrong{background:color-mix(in oklab,var(--danger) 22%,var(--surface));border-color:var(--danger)}
.q-big{font-family:var(--f-display);font-size:24px;font-weight:700}
.gcal-f{width:100%;border:0;border-radius:12px;background:#fff;display:block}
.swatches{display:flex;gap:5px;flex-wrap:wrap;flex-basis:100%}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tr-q{gap:14px}
.tr-text{font-size:17px;line-height:1.5;font-weight:600}
.tr-text.sm{font-size:14px}
.tr-text b{color:var(--a)}
.seq{display:block;margin-top:10px;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word}
.tr-text.sm .seq{font-size:17px;margin-top:4px}
.figrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.figgrid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;margin-top:12px}
.fig{width:64px;height:64px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink,currentColor);box-sizing:border-box;padding:2px}
.fig.qm{display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--a);border-style:dashed}
.tr-text.sm .fig{width:44px;height:44px}.tr-text.sm .figgrid{grid-template-columns:repeat(3,44px)}
.opts.figs{grid-template-columns:repeat(4,minmax(0,84px));justify-content:start}
.opts.figs button{padding:6px;display:flex;justify-content:center}
.opts.figs .fig{border:0;background:transparent;width:100%;height:auto;aspect-ratio:1}
.opts .tr-l{display:inline-block;min-width:22px;color:var(--muted);font-weight:700}
.tr-time{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:10px;background:var(--t)}
.tr-time.low{color:var(--danger)}
.tr-ans{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;border:1px solid var(--line)}
.tr-ans.good{border-color:var(--ok)}.tr-ans.wrong{border-color:var(--danger)}
.tr-ans .fig{width:36px;height:36px;border:0;padding:0;background:transparent}
.tr-modes{display:grid;gap:10px}
.tr-mode{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--t);cursor:pointer}
.tr-mode:hover{border-color:var(--a)}
.tr-mode b{font-family:var(--f-display);font-size:18px}

/* Mobile */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);gap:8px}
  .brand{padding:0}
  .brand > div{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;padding:7px 11px;font-size:14px}
  .nav .cnt{display:none}
  .side-foot{display:none}
  main{padding-top:18px}
  .vh{padding:20px 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.6;transform:translateY(4px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;box-shadow:var(--shadow)}
</style>

function paques(y) { const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return iso(new Date(y, mo - 1, da)); }
function avent(y) { const n = pISO(y + "-12-25"); const k = n.getDay() || 7; return addD(y + "-12-25", -k - 21); }
function bapteme(y) { const e = pISO(y + "-01-06"); const k = (7 - e.getDay()) % 7 || 7; return addD(y + "-01-06", k); }
function temps(s) {
  const y = pISO(s).getFullYear(), P = paques(y);
  if (s >= avent(y) && s < y + "-12-25") return ["Temps de l'Avent", "#7A4FA3"];
  if (s >= y + "-12-25" || s <= bapteme(y)) return ["Temps de Noël", "#D9B34A"];
  if (s >= addD(P, -46) && s < addD(P, -7)) return ["Temps du Carême", "#7A4FA3"];
  if (s >= addD(P, -7) && s < P) return ["Semaine sainte", "#B23A3A"];
  if (s >= P && s <= addD(P, 49)) return ["Temps pascal", "#D9B34A"];
  return ["Temps ordinaire", "#3E8A55"];
}

function dueOn(d) {

  S.suf.tasks.forEach(t => { if (t.due === d && !t.done) out.push({title:"Camp · " + t.title, h:135, page:"suf"}); });
  S.cours.subjects.forEach(s => s.deadlines.forEach(x => { if (x.date === d && !x.done) out.push({title:s.name + " · " + x.title, h:s.h, page:"cours"}); }));

}

// Cours
let rev = null; // {sid, queue:[ids], shown:false, ok:0, n:0}
R.cours = () => {
  const C = S.cours, T = today();
  let sel = C.subjects.find(s => s.id === S.prefs.coursSel) || C.subjects[0];
  const all = C.subjects.flatMap(s => s.deadlines.filter(d => !d.done).map(d => ({...d, s}))).sort((a, b) => a.date.localeCompare(b.date));
  let body = "";
  if (sel) {
    const card = rev && rev.sid === sel.id && rev.queue.length ? sel.cards.find(c => c.id === rev.queue[0]) : null;
    body = `<div class="grid-2" style="--h:${sel.h}">
    <div class="stack" style="gap:16px">
    <section class="card"><h2>${ic("book")}${esc(sel.name)}${exChip(sel)} <button class="sub x" data-act="subDel" data-id="${sel.id}" style="font-size:13px">Supprimer la matière</button></h2>
      <h3 class="row" style="gap:6px">${ic("clock", 16)}Échéances</h3>
      <div class="list">${sel.deadlines.slice().sort((a, b) => a.date.localeCompare(b.date)).map(d => `<div class="item ${d.done ? "done" : ""}"><input type="checkbox" class="check" data-in="dlDone" data-id="${d.id}" ${d.done ? "checked" : ""} aria-label="Fait"><div class="body"><div class="t">${esc(d.title)}</div><div class="meta"><span class="chip">${esc(d.type)}</span>${dueChip(d.date, d.done)}</div></div><button class="x" data-act="dlDel" data-id="${d.id}" aria-label="Supprimer">×</button></div>`).join("") || `<p class="muted small">Aucune échéance pour cette matière.</p>`}</div>
      <form class="add" data-form="dlAdd"><input type="text" id="dl-t" name="t" placeholder="Partiel, exposé, TD…" required><input type="date" id="dl-d" name="d" required aria-label="Date"><select id="dl-ty" name="ty" aria-label="Type"><option>Devoir</option><option>Examen</option><option>Oral</option><option>Lecture</option><option>Projet</option></select><button class="btn pri">Ajouter</button></form></section>
    <section class="card"><h2>${ic("pen")}Contenu du cours <span class="sub">enregistré automatiquement</span></h2>
      <textarea id="notes-${sel.id}" data-in="subNotes" rows="12" placeholder="Plan du cours, définitions, liens vers les supports…">${esc(sel.notes)}</textarea></section>
    ${docsBlock("cours", sel.id, "Documents de " + esc(sel.name))}
    </div>
    <section class="card"><h2>${ic("cards")}Fiches de révision <span class="sub">${sel.cards.length} fiche${sel.cards.length > 1 ? "s" : ""}</span></h2>
      ${card ? `<div class="flash"><span class="box">Boîte ${card.box} · encore ${rev.queue.length} fiche${rev.queue.length > 1 ? "s" : ""}</span><p class="q">${esc(card.q)}</p>${rev.shown ? `<p class="a">${esc(card.a)}</p><div class="row" style="justify-content:center"><button class="btn" data-act="revAns" data-ok="0">À revoir</button><button class="btn pri" data-act="revAns" data-ok="1">Je savais</button></div>` : `<div><button class="btn pri" data-act="revShow">Voir la réponse</button></div>`}</div><button class="btn sm ghost" data-act="revStop">Arrêter la révision</button>`
        : rev && rev.sid === sel.id && rev.n ? `<div class="flash"><p class="q">Révision terminée</p><p>${rev.ok} / ${rev.n} réponses sues du premier coup.</p><div><button class="btn pri" data-act="revStart">Recommencer</button></div></div>`
        : sel.cards.length ? `<div class="row"><button class="btn pri" data-act="revStart">Réviser ces fiches</button><span class="muted small">Les fiches de la boîte 1 passent en premier.</span></div>` : ""}
      <div class="list">${sel.cards.map(c => `<div class="item"><span class="chip out">B${c.box}</span><div class="body"><div class="t">${esc(c.q)}</div><div class="meta">${esc(c.a)}</div></div><button class="x" data-act="cardDel" data-id="${c.id}" aria-label="Supprimer">×</button></div>`).join("") || `<p class="empty">Crée ta première fiche : une question, une réponse.</p>`}</div>
      <form class="stack" data-form="cardAdd"><input type="text" id="cq" name="q" placeholder="Question ou notion" required><textarea id="ca" name="a" rows="2" placeholder="Réponse" required></textarea><div><button class="btn pri">Ajouter la fiche</button></div></form></section></div>`;
  }
  return head("Cours", "Mes études", all.length ? `Prochaine échéance : ${esc(all[0].title)} (${esc(all[0].s.name)}), ${rel(all[0].date)}.` : "Aucune échéance à venir.") +
  `<div class="tabs">${C.subjects.map(s => `<button style="--h:${s.h}" data-act="subSel" data-id="${s.id}" aria-pressed="${sel && sel.id === s.id}"><span class="dot"></span>${esc(s.name)}</button>`).join("")}
    <form class="add" data-form="subAdd" style="flex-wrap:nowrap"><input type="text" id="sub-n" name="n" placeholder="Nouvelle matière" required style="width:160px"><button class="btn">+</button></form></div>` + body +
  linkedBlock("cours") + (all.length ? `<section class="card"><h2>${ic("clock")}Toutes les échéances</h2><div class="list">${all.slice(0, 10).map(d => `<div class="item"><span class="dot" style="--h:${d.s.h};margin-top:7px"></span><div class="body"><div class="t">${esc(d.title)}</div><div class="meta"><span>${esc(d.s.name)} · ${esc(d.type)}</span>${dueChip(d.date)}</div></div></div>`).join("")}</div></section>` : "");
};
const selSub = () => S.cours.subjects.find(s => s.id === S.prefs.coursSel) || S.cours.subjects[0];
ACT.subSel = el => { S.prefs.coursSel = el.dataset.id; rev = null; save("prefs"); };
ACT.subDel = el => { S.cours.subjects = S.cours.subjects.filter(s => s.id !== el.dataset.id); save("cours"); };
FORM.subAdd = (f, d) => { const hs = [250,20,85,165,305,45,200]; const s = {id:uid(),name:d.get("n"),h:hs[S.cours.subjects.length % hs.length],notes:"",deadlines:[],cards:[]}; S.cours.subjects.push(s); S.prefs.coursSel = s.id; save("cours"); save("prefs"); };
FORM.dlAdd = (f, d) => { selSub().deadlines.push({id:uid(),title:d.get("t"),date:d.get("d"),type:d.get("ty"),done:false}); save("cours"); };
FORM.cardAdd = (f, d) => { selSub().cards.push({id:uid(),q:d.get("q"),a:d.get("a"),box:1}); save("cours"); };
ACT.dlDel = el => { const s = selSub(); s.deadlines = s.deadlines.filter(x => x.id !== el.dataset.id); save("cours"); };
ACT.cardDel = el => { const s = selSub(); s.cards = s.cards.filter(x => x.id !== el.dataset.id); save("cours"); };
IN.dlDone = el => { const x = selSub().deadlines.find(d => d.id === el.dataset.id); x.done = el.checked; save("cours"); };
IN.subNotes = el => { selSub().notes = el.value; save("cours"); return false; };
ACT.revStart = () => { const s = selSub(); rev = {sid:s.id, queue:shuffle(s.cards).sort((a, b) => a.box - b.box).map(c => c.id), shown:false, ok:0, n:0, seen:new Set()}; };
ACT.revShow = () => { rev.shown = true; };
ACT.revStop = () => { rev = null; };
ACT.revAns = el => {
  const s = selSub(), id = rev.queue.shift(), c = s.cards.find(x => x.id === id), ok = el.dataset.ok === "1";
  if (!rev.seen.has(id)) { rev.n++; if (ok) rev.ok++; rev.seen.add(id); }
  c.box = ok ? Math.min(3, c.box + 1) : 1;
  if (!ok) rev.queue.splice(Math.min(rev.queue.length, 3), 0, id);
  rev.shown = false; save("cours");
};

// Idées

    ${sel ? `<article class="paper"><div class="row" style="flex-wrap:nowrap"><input class="ptitle" id="pt-${sel.id}" value="${esc(sel.title)}" placeholder="Titre de la page" data-in="pageTitle" data-id="${sel.id}" aria-label="Titre">${sel.ex ? `<span class="chip ex">exemple</span>` : ""}

ACT.ideeTab = el => { S.prefs.ideeTab = el.dataset.k; save("prefs"); };
ACT.pageAdd = () => { const p = {id:uid(),title:"",text:"",at:Date.now()}; S.idees.carnet.push(p); carnetSel = p.id; save("idees"); render(); const t = $("#pt-" + p.id); t && t.focus(); return false; };
ACT.pageSel = el => { carnetSel = el.dataset.id; };
ACT.pageDel = el => { S.idees.carnet = S.idees.carnet.filter(p => p.id !== el.dataset.id); delPending = null; carnetSel = null; save("idees"); };
IN.pageTitle = el => { const p = S.idees.carnet.find(x => x.id === el.dataset.id); p.title = el.value; save("idees"); return false; };
IN.pageText = el => { const p = S.idees.carnet.find(x => x.id === el.dataset.id); p.text = el.value; p.at = Date.now(); save("idees"); grow(el); return false; };
R.idees = () => {
  const IT = S.prefs.ideeTab === "carnet" ? "carnet" : "notes";
  const tabs = `<div class="seg" role="group" aria-label="Affichage"><button data-act="ideeTab" data-k="notes" aria-pressed="${IT === "notes"}">${ic("bulb", 16)}Idées en vrac</button><button data-act="ideeTab" data-k="carnet" aria-pressed="${IT === "carnet"}">${ic("book", 16)}Mon carnet</button></div>`;
  if (IT === "carnet") return head("Idées", "Mon carnet", "Un petit carnet pour rédiger : comptes rendus, réflexions, brouillons. Tout s'enregistre pendant que tu écris.") + tabs + rCarnet();
  const N = S.idees.notes.slice().sort((a, b) => (b.pinned - a.pinned) || b.at - a.at);
  const hs = [90,20,200,135,305,250];
  return head("Idées", "Bloc-notes en vrac", "Tout ce qui te passe par la tête. Chaque note s'enregistre pendant que tu écris.",
    `<button class="btn pri" data-act="noteAdd">Nouvelle note</button>`) +
  tabs + `<div class="row"><input type="search" id="idea-q" data-in="ideaQ" placeholder="Rechercher dans mes idées…" value="${esc(ideaQ)}" style="flex:1 1 220px;max-width:420px"></div>
  <div class="tabs" role="group" aria-label="Filtrer par étiquette"><button data-act="ideaTag" data-id="all" aria-pressed="${ideaTag === "all"}">Toutes</button>${S.todo.tags.map(t => `<button style="--h:${t.h}" data-act="ideaTag" data-id="${t.id}" aria-pressed="${ideaTag === t.id}"><span class="dot"></span>${esc(t.name)} <span class="muted small">${S.idees.notes.filter(n => n.tag === t.id).length}</span></button>`).join("")}</div>

ACT.noteColor = el => { S.idees.notes.find(x => x.id === el.dataset.id).h = +el.dataset.h; save("idees"); };
ACT.notePin = el => { const n = S.idees.notes.find(x => x.id === el.dataset.id); n.pinned = !n.pinned; save("idees"); };
ACT.noteDel = el => { S.idees.notes = S.idees.notes.filter(x => x.id !== el.dataset.id); save("idees"); };
IN.noteTitle = el => { const n = S.idees.notes.find(x => x.id === el.dataset.id); n.title = el.value; n.at = Date.now(); save("idees"); return false; };

// Évangile
let vOff = 0;
R.evangile = () => {
  const T = today(), [tp, tc] = temps(T), f = fete(T);
  const base = (pISO(T) - pISO(T.slice(0, 4) + "-01-01")) / 864e5 | 0;
  const vi = ((base + vOff) % VERSETS.length + VERSETS.length) % VERSETS.length, v = VERSETS[vi];
  const fav = S.foi.fav.includes(vi);
  const links = [
    [`https://www.aelf.org/${T}/romain/messe`, "Évangile et lectures de la messe", "AELF, traduction officielle liturgique"],
    [`https://www.aelf.org/${T}/romain/laudes`, "Laudes du jour", "Prière du matin sur AELF"],
    ["https://levangileauquotidien.org/FR/gospel", "L'Évangile au quotidien", "Évangile du jour et commentaire d'un Père de l'Église"],
    ["https://nominis.cef.fr/", "Nominis", "Vie du saint du jour, par l'Église catholique en France"]
  ];
  return head(fmtLong(T), "Spi", "Évangile et saint du jour, prières et textes scouts.", `<span class="season"><i style="background:${tc}"></i>${tp}</span>`) +
  `<div class="grid-2">
  <section class="card"><span class="eyebrow">${vOff ? "Verset" : "Verset du jour"}</span><p class="verse">« ${esc(v[0])} »</p><p class="ref">${esc(v[1])}</p>
    <div class="row"><button class="btn" data-act="vNext">Un autre verset</button><button class="btn ${fav ? "on" : ""}" data-act="vFav" data-i="${vi}">${fav ? "Dans mes favoris" : "Garder en favori"}</button></div></section>
  <section class="card"><h2>${ic("star")}Fête du jour</h2><p class="q-big">${esc(feteLabel(f))}</p>
    <p class="muted small">D'après le calendrier usuel des fêtes. Le saint célébré à la messe peut être différent : vérifie sur Nominis ou AELF.</p>
    <div class="list">${[1,2,3,4,5,6].map(i => { const d = addD(T, i); return `<div class="item"><span class="small muted" style="width:92px;flex:none">${JC[pISO(d).getDay()]} ${pISO(d).getDate()} ${MOIS[pISO(d).getMonth()].slice(0,4)}.</span><div class="body">${esc(fete(d))}</div></div>`; }).join("")}</div></section></div>
  <section class="card"><h2>${ic("book")}Lire et prier</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">${links.map(([u, t, s]) => `<a class="linkbtn" href="${u}" target="_blank" rel="noopener"><div><b>${t}</b><small>${s}</small></div><span class="arr">↗</span></a>`).join("")}</div></section>
  <div class="grid-2">
  <section class="card"><h2>${ic("fire")}Prière scoute</h2><p class="prayer">${PRIERE_SCOUTE}</p></section>
  <section class="card"><h2>${ic("heart")}Prière des Guides-Aînées</h2><p class="prayer" style="white-space:pre-line">${PRIERE_GA}</p></section>
  <section class="card"><h2>${ic("tent")}Loi scoute</h2><ol class="loi">${LOI.map(l => `<li>${l}</li>`).join("")}</ol><h3>Principes</h3><ol class="loi">${PRINCIPES.map(l => `<li>${l}</li>`).join("")}</ol></section>
  <section class="card"><h2>${ic("star")}Promesse</h2><p class="prayer" style="white-space:pre-line">${PROMESSE}</p></section>
  <section class="card"><h2>${ic("heart")}Mes intentions de prière</h2><textarea id="intentions" data-in="intent" rows="6" placeholder="Pour qui, pour quoi veux-tu prier cette semaine ?">${esc(S.foi.intentions)}</textarea></section></div>
  <section class="card"><h2>${ic("star")}Mes versets favoris <span class="sub">${S.foi.fav.length}</span></h2>${S.foi.fav.length ? `<div class="list">${S.foi.fav.map(i => VERSETS[i] ? `<div class="item"><div class="body"><span style="font-family:var(--f-quote);font-style:italic;font-size:17px">« ${esc(VERSETS[i][0])} »</span> <span class="ref" style="font-size:11px">${esc(VERSETS[i][1])}</span></div><button class="x" data-act="vFav" data-i="${i}" aria-label="Retirer">×</button></div>` : "").join("")}</div>` : `<p class="muted small">Garde ici les versets qui te parlent.</p>`}</section>`;
};
ACT.vNext = () => { vOff++; };
ACT.vFav = el => { const i = +el.dataset.i; const f = S.foi.fav; const k = f.indexOf(i); if (k >= 0) f.splice(k, 1); else f.push(i); save("foi"); };

  setSync("wait");
  try {
    const sb = sbClient();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setSync("local"); loginView(); return; }
    SB_USER = session.user;
    const col = sbCollection(SB_USER.id), rows = await col.getAll();
    const remote = {}; rows.forEach(r => remote[r.key] = r);
    const toPush = [];
    KEYS.forEach(k => { const r = remote[k]; if (r && r.v && !dirty.has(k)) S[k] = r.v; else toPush.push(k); });
    const before = {}; KEYS.forEach(k => before[k] = JSON.stringify(S[k]));
    migrate();
    KEYS.forEach(k => { lsSet(k, S[k]); if (before[k] !== JSON.stringify(S[k]) && !toPush.includes(k)) toPush.push(k); });
    COL = col; ASSETS = sbAssets(SB_USER.id);
    toPush.forEach(k => flush(k));
    if (!siteConnect.listening) { siteConnect.listening = true; KEYS.forEach(listen); }
    lastSync = Date.now(); setSync("ok"); applyTheme(); softRender();
    icalSync();
  } catch (e) {
    syncErr = (e && e.code) || "connexion"; syncErrRaw = (e && e.raw) || ""; setSync("err");
    // Nouvel essai dans 30 s ; l'aide pour réparer s'affiche dans Réglages
    clearTimeout(siteConnect.t); if (SB_USER) siteConnect.t = setTimeout(siteConnect, 30000);
    softRender();
  }
}

// Synchro des agendas Google (adresse secrète iCal) via la fonction Supabase « ical »
let icalLast = 0;
async function icalSync(only) {
  if (!SB_USER || !S.agenda) return;
  const accs = S.agenda.accounts.filter(a => a.ical && (!only || a.id === only)); if (!accs.length) return;
  if (!only) icalLast = Date.now();
  let ch = false;
  await Promise.all(accs.map(async a => {
    ICAL_ST[a.id] = Object.assign({}, ICAL_ST[a.id], {wait: true}); if (cur() === "agenda") softRender();
    try {
      const { data, error } = await sbClient().functions.invoke("ical", { body: { url: a.ical } });
      if (error) {
        let msg = error.message || "erreur";
        try { const t = error.context && await error.context.text(); if (t) msg = t; } catch {}
        if (/not found|404/i.test(msg)) msg = "la fonction « ical » n'est pas encore installée dans Supabase (voir LISEZMOI).";
        throw new Error(msg);
      }
      const txt = String(data || ""); if (!/BEGIN:VCALENDAR/.test(txt)) throw new Error("Google n'a pas renvoyé d'agenda. Vérifie l'adresse iCal.");
      const before = JSON.stringify(S.agenda.events), n = importICS(txt, a.id);
      if (before !== JSON.stringify(S.agenda.events)) ch = true;
      ICAL_ST[a.id] = {at: Date.now(), n};
    } catch (e) { ICAL_ST[a.id] = {err: String((e && e.message) || e).slice(0, 200)}; }
  }));
  if (only || ch || ["agenda", "aujourdhui"].includes(cur())) softRender();
}

function mkOpts(good, wrongs, n = 4) {
  const g = String(good), w = shuffle([...new Set(wrongs.map(String))].filter(x => x !== g)).slice(0, n - 1);
  const opts = shuffle([g, ...w]); return {opts, a: opts.indexOf(g)};
